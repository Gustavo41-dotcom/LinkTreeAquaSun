        body { font-family: 'DM Sans', sans-serif; }

        .link-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        
        .glass-shine {
          position: absolute;

        .glass-shine.active {

        h1 {
          position: relative;

        }
        
        h1.active::after {
          opacity: 0.6;
        }

  <script>
    // iOS 26-style dynamic glass shine effect
    let deviceMotion = null;
    let hasMotionPermission = false;
    
    // Check if device supports motion
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      // iOS 13+ requires permission request
      document.addEventListener('touchstart', () => {
        if (!hasMotionPermission) {
          DeviceMotionEvent.requestPermission()
            .then(permissionState => {
              if (permissionState === 'granted') {
                hasMotionPermission = true;
                window.addEventListener('devicemotion', handleDeviceMotion);
              }
            })
            .catch(console.error);
        }
      }, { once: true });
    } else if (typeof DeviceMotionEvent !== 'undefined') {
      // Older Android devices
      window.addEventListener('devicemotion', handleDeviceMotion);
      hasMotionPermission = true;
    }
    
    function handleDeviceMotion(event) {
      deviceMotion = event;
    }
    
    function updateShineEffect(element, shine, clientX, clientY) {
      const rect = element.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      
      const percentage = {
        x: (x / rect.width) * 100,
        y: (y / rect.height) * 100
      };
      
      shine.style.left = `${percentage.x - 50}%`;
      shine.style.top = `${percentage.y - 50}%`;
    }
    
    // Desktop mouse tracking
    document.addEventListener('mousemove', (e) => {
      // Update link buttons
      document.querySelectorAll('.link-btn .glass-shine').forEach(shine => {
        updateShineEffect(shine.parentElement, shine, e.clientX, e.clientY);
        shine.classList.add('active');
      });
      
      // Update name heading
      const heading = document.querySelector('h1');
      if (heading) {
        const rect = heading.getBoundingClientRect();
        const percentageX = ((e.clientX - rect.left) / rect.width) * 100;
        const percentageY = ((e.clientY - rect.top) / rect.height) * 100;
        heading.style.setProperty('--shine-x', `${percentageX}%`);
        heading.style.setProperty('--shine-y', `${percentageY}%`);
        heading.classList.add('active');
      }
    });
    
    document.addEventListener('mouseleave', () => {
      document.querySelectorAll('.glass-shine').forEach(shine => {
        shine.classList.remove('active');
      });
      document.querySelector('h1').classList.remove('active');
    });
    
    // Mobile accelerometer tracking
    setInterval(() => {
      if (deviceMotion && hasMotionPermission) {
        const accel = deviceMotion.accelerationIncludingGravity;
        
        // Map accelerometer values to screen position (-10 to 10 range)
        const x = ((accel.x || 0) / 10 + 1) * 50; // 0-100%
        const y = ((accel.y || 0) / 10 + 1) * 50; // 0-100%
        
        // Clamp values
        const clampedX = Math.max(0, Math.min(100, x));
        const clampedY = Math.max(0, Math.min(100, y));
        
        // Update link buttons
        document.querySelectorAll('.link-btn .glass-shine').forEach(shine => {
          shine.style.left = `${clampedX - 50}%`;
          shine.style.top = `${clampedY - 50}%`;
          shine.classList.add('active');
        });
        
        // Update heading
        const heading = document.querySelector('h1');
        if (heading) {
          heading.style.setProperty('--shine-x', `${clampedX}%`);
          heading.style.setProperty('--shine-y', `${clampedY}%`);
          heading.classList.add('active');
        }
      }
    }, 16); // ~60fps
  </script>
