<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaSun - Link Tree</title>
  
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --text-blue: #15709c;
      --text-orange: #feaf16;
      --glass-bg: rgba(185, 230, 250, 0.35);
      --glass-border: rgba(255, 255, 255, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: url('background.svg') center center / cover fixed no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    /* =========================================
       EFEITO LIQUID GLASS (BORDA)
       ========================================= */
    .liquid-wrapper {
      position: relative;
      width: 100%;
      border-radius: 18px;
      padding: 2px; 
      background: var(--glass-border);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .liquid-wrapper:active {
      transform: scale(0.96);
    }

    .liquid-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle 70px at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 1), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
