<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaSun - Link Tree & Showcase</title>
  
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --text-blue: #15709c;
      --text-orange: #feaf16;
      --glass-bg: rgba(185, 230, 250, 0.35);
      --glass-border: rgba(255, 255, 255, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: url('background.svg') center center / cover fixed no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
      z-index: 10;
    }

    /* =========================================
       EFEITO LIQUID GLASS (BOTÕES E CARDS)
       ========================================= */
    .liquid-wrapper {
      position: relative;
      width: 100%;
      border-radius: 18px;
      padding: 2px; 
      background: var(--glass-border);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .liquid-wrapper:active {
      transform: scale(0.96);
    }

    .liquid-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle 80px at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 1), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1;
    }

    .liquid-wrapper:hover::before {
      opacity: 1;
    }

    .liquid-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-blue);
      font-weight: 600;
      font-size: 15px;
      padding: 14px 20px;
      z-index: 2;
    }

    .team-inner {
      justify-content: flex-start;
      padding: 10px 16px;
    }

    /* =========================================
       ELEMENTOS DE IDENTIDADE
       ========================================= */
    .avatar-wrapper {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 2px;
      margin-bottom: 8px;
      position: relative;
      z-index: 20;
    }
    .avatar-inner {
      border-radius: 50%;
      padding: 0;
      background: white; 
    }
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .name-wrapper { width: auto; margin-bottom: 2px; }
    .name-inner { padding: 8px 24px; font-size: 28px; }

    .bio-pill {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 12px 20px;
      border-radius: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--text-blue);
      font-weight: 500;
      margin-bottom: 8px;
      line-height: 1.4;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .bio-pill strong { font-weight: 800; }
    .bio-pill .highlight { color: var(--text-orange); font-weight: 800; }
    
    .svg-icon { width: 22px; height: 22px; fill: currentColor; }
    .team-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.6); }
    .section-title { color: #ffffff; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-top: 20px; margin-bottom: 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

    /* =========================================
       SISTEMA DE ABAS DO PROJETO (SLIDES)
       ========================================= */
    .project-showcase {
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.08);
      margin-top: 10px;
    }

    .tabs-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 4px;
      border-radius: 10px;
      color: var(--text-blue);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-btn.active {
      background: var(--text-blue);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(21, 112, 156, 0.3);
    }

    .tab-content {
      display: none;
      color: #1e293b;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn 0.4s ease;
    }

    .tab-content.active {
      display: block;
    }

    .tab-content h4 {
      color: var(--text-blue);
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .embedded-sketch {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =========================================
       RODAPÉ CORPORATIVO DUPLO
       ========================================= */
    .corporate-footer {
      margin-top: 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding-bottom: 20px;
    }

    .footer-title {
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .badge-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 24px;
      border-radius: 50px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }

    .badge-row img {
      height: 28px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    /* =========================================
       MODAL DE VÍDEO (YOUTUBE ELÁSTICO)
       ========================================= */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; 
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none; 
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .modal-overlay.show { 
      opacity: 1; 
      pointer-events: auto; 
    }

    .modal-content {
      width: 90%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 10px;
      transform: scale(0.82) translateY(40px);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .modal-overlay.show .modal-content {
      transform: scale(1) translateY(0);
    }

    .close-btn {
      position: absolute;
      top: -16px;
      right: -16px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      border-radius: 50%;
      width: 38px; height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      z-index: 10;
      transition: all 0.2s ease;
    }

      position: relative;
      width: 1
