<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaSun - Link Tree</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
        :root {
          --bg-glass: rgba(185, 230, 250, 0.2);
          --border-glass: rgba(255, 255, 255, 0.4);
          --text-blue: #15709c;
          --text-orange: #feaf16;
        }
        
        body { 
          font-family: 'DM Sans', sans-serif;
          background-image: url('background.svg');
          background-size: cover;
          background-position: center;
          background-attachment: fixed;
          min-height: 100vh;
          margin: 0;
          overflow-x: hidden;
        }
        
        /* Base do Vidro Fosco (Distorção) */
        .glass-element {
          background: var(--bg-glass);
          backdrop-filter: blur(20px) saturate(150%);
          -webkit-backdrop-filter: blur(20px) saturate(150%);
          border-radius: 16px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
          position: relative;
        }

        .link-btn { 
          color: var(--text-blue);
          transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
          overflow: hidden;
        }

        .link-btn:active { transform: scale(0.96); }

        /* O Segredo do Brilho nas Bordas (iOS 26 Style) - Agora calibrado em pixels */
        .liquid-shine {
          position: relative;
        }

        .liquid-shine::before {
          content: '';
          position: absolute;
          inset: 0;
          border-radius: inherit;
          padding: 2px; 
          background: radial-gradient(circle 60px at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.9), transparent 40%);
          -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          -webkit-mask-composite: xor;
          mask-composite: exclude;
          opacity: 0;
          transition: opacity 0.3s ease;
          pointer-events: none;
          z-index: 2;
        }

        .liquid-shine::after {
          content: '';
          position: absolute;
          inset: 0;
          border-radius: inherit;
          background: radial-gradient(circle 80px at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.3), transparent 50%);
          opacity: 0;
          transition: opacity 0.3s ease;
          pointer-events: none;
          z-index: 1;
        }

        .liquid-shine:hover::before,
        .liquid-shine:hover::after {
          opacity: 1;
        }
        
        .avatar-container {
          position: relative;
          border-radius: 50%;
          overflow: hidden;
          transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar-container:hover {
          transform: scale(1.08);
        }

        /* Animação Fluida do Modal */
        #video-modal {
          opacity: 0;
          pointer-events: none;
          transition: all 0.5s ease;
          z-index: 50;
          backdrop-filter: blur(0px);
          -webkit-backdrop-filter: blur(0px);
        }

        #video-modal.active {
          opacity: 1;
          pointer-events: auto;
          backdrop-filter: blur(15px);
          -webkit-backdrop-filter: blur(15px);
        }

        .modal-content {
          transform: scale(0.8) translateY(30px);
          opacity: 0;
          transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #video-modal.active .modal-content {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
  </style>
</head>
<body class="w-full flex items-center justify-center p-6">
  
  <main class="w-full max-w-md flex flex-col items-center gap-4 z-10">
    
    <div id="avatar-trigger" title="Hold or click for video" class="avatar-container w-28 h-28 cursor-pointer glass-element liquid-shine border border-white/40">
      <img class="w-full h-full object-cover rounded-full" src="logo.png" alt="Logo AquaSun">
    </div>
    
    <div class="glass-element liquid-shine px-6 py-2 flex gap-1 relative border border-white/30">
        <span style="color: var(--text-blue); font-weight: 700; font-size: 28px;">Aqua</span>
        <span style="color: var(--text-orange); font-weight: 700; font-size: 28px;">Sun</span>
    </div>
    
    <p class="text-center max-w-xs mb-2" style="color: var(--text-blue); font-weight: 500; font-size: 14px; line-height: 1.4; text-shadow: 0 1px 2px rgba(255,255,255,0.6);">
        Transforming solar energy into clean water and liquid dignity ☀️
    </p>

    <nav class="w-full flex flex-col gap-3" aria-label="Links">
