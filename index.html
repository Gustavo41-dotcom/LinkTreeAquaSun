<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaSun - Link Tree</title>
  
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --text-blue: #15709c;
      --text-orange: #feaf16;
      --glass-bg: rgba(185, 230, 250, 0.35);
      --glass-border: rgba(255, 255, 255, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: url('background.svg') center center / cover fixed no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    /* =========================================
       EFEITO LIQUID GLASS
       ========================================= */
    .liquid-wrapper {
      position: relative;
      width: 100%;
      border-radius: 18px;
      padding: 2px; 
      background: var(--glass-border);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .liquid-wrapper:active {
      transform: scale(0.96);
    }

    .liquid-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle 70px at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 1), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1;
    }

    .liquid-wrapper:hover::before {
      opacity: 1;
    }

    .liquid-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-blue);
      font-weight: 600;
      font-size: 16px;
      padding: 14px 20px;
      z-index: 2;
    }

    /* =========================================
       ELEMENTOS ESPECÍFICOS
       ========================================= */
    .avatar-wrapper {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 3px;
      margin-bottom: 8px;
    }
    .avatar-inner {
      border-radius: 50%;
      padding: 0;
      background: white; 
    }
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .name-wrapper {
      width: auto;
      margin-bottom: 2px;
    }
    .name-inner {
      padding: 8px 24px;
      font-size: 28px;
    }

    .bio-pill {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 12px 20px;
      border-radius: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--text-blue);
      font-weight: 500;
      margin-bottom: 8px;
      line-height: 1.4;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .bio-pill strong { font-weight: 800; }
    .bio-pill .highlight { color: var(--text-orange); font-weight: 800; }
    .svg-icon { width: 22px; height: 22px; fill: currentColor; }

    /* =========================================
       MODAL DE VÍDEO (YOUTUBE)
       ========================================= */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none; 
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.show { opacity: 1; }

    .modal-content {
      width: 90%;
      /* Aumentado de 360px para 480px para dar mais destaque ao vídeo */
      max-width: 480px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 10px;
      transform: scale(0.8) translateY(30px);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .modal-overlay.show .modal-content {
      transform: scale(1) translateY(0);
    }

    /* NOVO BOTÃO DE FECHAR (Liquid Glass Minimalista) */
    .close-btn {
      position: absolute;
      top: -16px;
      right: -16px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      border-radius: 50%;
      width: 38px; height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.4);
      z-index: 10;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    /* Container Responsivo para o iframe do YouTube */
    .youtube-container {
      position: relative;
      width: 100%;
      /* 56.25% é para vídeos 16:9. Para vídeos verticais (Shorts), use 177.77% */
      padding-bottom: 56.25%; 
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .youtube-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

    <a href="https://www.tiktok.com/@aquasunproject" target="_blank" class="liquid-wrapper">

  <div id="videoModal" class="modal-overlay">
    <div class="modal-content">
      <button id="closeBtn" class="close-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="youtube-container">
        <iframe id="youtubePlayer" src="" title="AquaSun Prototype" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      
      <div style="padding: 14px 12px 6px; text-align: center;">
        <h3 style="color: #ffffff; font-size: 16px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.6);">The Prototype in Action</h3>
        <p style="color: #f1f5f9; font-size: 13px; font-weight: 500; margin-top: 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);">Hybrid distillation and active cooling.</p>
      </div>
    </div>
  </div>

  <script>
    // === SEU ID DO YOUTUBE ===
    const MEU_ID_YOUTUBE = "lAISFycVCpM"; 
    // =========================

    const wrappers = document.querySelectorAll('.liquid-wrapper');
    wrappers.forEach(el => {
      el.addEventListener('mousemove', e => {
        const rect = el.getBoundingClientRect();
        el.style.setProperty('--x', `${e.clientX - rect.left}px`);
        el.style.setProperty('--y', `${e.clientY - rect.top}px`);
      });
    });

    const avatar = document.getElementById('avatar-trigger');
    const modal = document.getElementById('videoModal');
    const ytPlayer = document.getElementById('youtubePlayer');
    const closeBtn = document.getElementById('closeBtn');
    let hoverTimer;

    function openModal() {
      modal.style.display = 'flex';
      setTimeout(() => modal.classList.add('show'), 10);
      
      ytPlayer.src = `https://www.youtube.com/embed/${MEU_ID_YOUTUBE}?autoplay=1&rel=0&modestbranding=1`;
    }

    function closeModal() {
      modal.classList.remove('show');
      setTimeout(() => {
        modal.style.display = 'none';
        ytPlayer.src = "";
      }, 300);
    }

    avatar.addEventListener('mouseenter', () => hoverTimer = setTimeout(openModal, 1500));
    avatar.addEventListener('mouseleave', () => clearTimeout(hoverTimer));
    avatar.addEventListener('click', () => { clearTimeout(hoverTimer); openModal(); });

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
  </script>

</body>
</html>
