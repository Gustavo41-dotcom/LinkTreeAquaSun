<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSun - Liquid Dignity</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --shadow-color: rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            perspective: 1000px; /* Ambiência 3D para os botões */
        }

        /* Container Principal do Site da Bio */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
        }

        /* Header e Identidade Visual */
        .header-logo {
            width: 90px;
            height: 90px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .header-logo img {
            width: 65%;
            height: auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .slogan {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-style: italic;
        }

        /* SEÇÃO DO VÍDEO NATIVO (Destaque do Protótipo) */
        .video-card {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
        }

        .video-card video {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .video-caption {
            padding: 14px;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* LINKS / BOTÕES ESTILO IOS 26 DE MOVIMENTO */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .apple-gyro-btn {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 18px 24px;
            border-radius: 16px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 30px var(--shadow-color), inset 0 1px 0 rgba(255,255,255,0.05);
            transform-style: preserve-3d;
            user-select: none;
        }

        .apple-gyro-btn:active {
            transform: scale(0.97) translateY(2px) !important;
            box-shadow: 0 4px 10px var(--shadow-color) !important;
        }

        footer {
            margin-top: 50px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }
    </style>
</head>
