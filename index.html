<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaSun - Link Tree</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
        :root {
          /* Ajustado para o azul claro translúcido da sua imagem */
          --bg-glass: rgba(185, 230, 250, 0.55);
          --border-glass: rgba(255, 255, 255, 0.4);
          --shadow-color: rgba(0, 0, 0, 0.08);
          --shine-x: 50%;
          --shine-y: 50%;
          --text-blue: #15709c;
          --text-orange: #feaf16;
        }
        
        body { 
          font-family: 'DM Sans', sans-serif;
          /* O fundo SVG será puxado daqui */
          background-image: url('background.svg');
          background-size: cover;
          background-position: center;
          background-attachment: fixed;
          background-repeat: no-repeat;
          min-height: 100vh;
          margin: 0;
        }
        
        .link-btn { 
          position: relative;
          background: var(--bg-glass) !important;
          backdrop-filter: blur(12px) saturate(180%);
          -webkit-backdrop-filter: blur(12px) saturate(180%);
          border: 1px solid var(--border-glass);
          color: var(--text-blue);
          box-shadow: 0 8px 24px var(--shadow-color), inset 0 1px 0 rgba(255, 255, 255, 0.3);
          transition: transform 0.2s ease, box-shadow 0.2s ease;
          overflow: hidden;
        }
        
        /* Efeito de brilho que acompanha o mouse */
        .link-btn::before {
          content: '';
          position: absolute;
          inset: 0;
